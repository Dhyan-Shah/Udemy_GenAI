[project]
name = "pdf-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhyan-Shah", email = "dhyanshah15114@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cassandra-driver>=3.30.1",
    "cassio>=0.1.10",
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.19.0",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "tiktoken>=0.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
pdf-chatbot = "pdf_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
