version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhyan-Shah", email = "dhyanshah15114@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
