    { name = "Dhyan-Shah", email = "dhyanshah15114@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
